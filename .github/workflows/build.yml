name: Forge 1.20.1 build

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3.5.0
        with:
          gradle-version: '8.8'
      - name: Build Forge mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: afk-cinematics-forge-1.20.1
          path: build/libs/*.jar
